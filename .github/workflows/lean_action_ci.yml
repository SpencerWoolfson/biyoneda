name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # Read access to repository contents

jobs:
  # Runs on every branch and pull request. It carries no `environment:`, because the
  # `github-pages` environment only admits the default branch, and GitHub rejects a job that
  # names it before the job starts -- which is how branch builds used to fail in two seconds.
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1

      # `lake build` exiting 0 does not mean the development is sound: sorries are
      # warnings, and a coherence field can be silently discharged by an autoparam
      # riding on a sorry elsewhere. Replay the (now cached) build to capture the
      # warnings and `#print axioms` output, then gate on both.
      - name: Capture build output
        shell: bash            # -eo pipefail, so a lake failure is not masked by tee
        run: lake build 2>&1 | tee build.log

      - name: Verify sorry count and axioms
        shell: bash
        run: ./scripts/verify-build.sh build.log

  # Publishes the API docs to GitHub Pages, from pushes to master only, and only once the
  # gates have passed.
  docs:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write    # Write access to GitHub Pages
      id-token: write # Write access to ID tokens
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1 # docgen needs the built project; restored from cache
      - uses: leanprover-community/docgen-action@v1
        id: deployment
