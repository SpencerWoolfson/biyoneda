name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1

      # `lake build` exiting 0 does not mean the development is sound: sorries are
      # warnings, and a coherence field can be silently discharged by an autoparam
      # riding on a sorry elsewhere. Replay the (now cached) build to capture the
      # warnings and `#print axioms` output, then gate on both.
      - name: Capture build output
        shell: bash            # -eo pipefail, so a lake failure is not masked by tee
        run: lake build 2>&1 | tee build.log

      - name: Verify sorry count and axioms
        shell: bash
        run: ./scripts/verify-build.sh build.log

      - uses: leanprover-community/docgen-action@v1
        id: deployment
