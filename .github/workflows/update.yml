name: Update Dependencies

# Drift alarm, not an auto-updater.
#
# The pin (`lakefile.toml`, `lean-toolchain`) is deliberate and bumping it is a human decision:
# measured twice on this project, a bump breaks every hand-rolled coherence field while leaving
# every `:= rfl` bridge alone, so it needs a budget rather than a merge. What this workflow is
# for is making the cost *visible early* -- a weekly attempt that tells you whether the next
# bump is free or expensive, while there is still only a week of Mathlib to bisect.
#
# Configured to NOTIFY ONLY. Both outcomes open an issue; neither opens a pull request and
# neither writes to a branch. The `permissions:` block below grants `issues: write` and nothing
# else, so even a misconfiguration cannot push code -- it would fail loudly instead.
on:
  schedule:
    - cron: "0 8 * * 1" # Mondays, 08:00 UTC. Weekly, not daily: a bump here is never routine.
  workflow_dispatch:    # Allows the workflow to be triggered manually via the GitHub interface

jobs:
  check-for-updates: # Determines which updates to apply.
    runs-on: ubuntu-latest
    outputs:
      is-update-available: ${{ steps.check-for-updates.outputs.is-update-available }}
      new-tags: ${{ steps.check-for-updates.outputs.new-tags }}
    steps:
      - name: Run the action
        id: check-for-updates
        uses: leanprover-community/mathlib-update-action@v1
        # START CONFIGURATION BLOCK 1
        # END CONFIGURATION BLOCK 1
  do-update: # Runs the upgrade, tests it, and makes a PR/issue/commit.
    runs-on: ubuntu-latest
    permissions:
      contents: read       # Read only: this workflow reports, it does not update the pin
      issues: write        # Its one output is an issue saying what it found
    needs: check-for-updates
    if: ${{ needs.check-for-updates.outputs.is-update-available == 'true' }}
    strategy: # Runs for each update discovered by the `check-for-updates` job.
      max-parallel: 1 # Ensures that the PRs/issues are created in order.
      matrix:
        tag: ${{ fromJSON(needs.check-for-updates.outputs.new-tags) }}
    steps:
      - name: Run the action
        id: update-the-repo
        uses: leanprover-community/mathlib-update-action/do-update@v1
        with:
          tag: ${{ matrix.tag }}
          # START CONFIGURATION BLOCK 2
          # Both outcomes are notifications. `issue` on success is deliberate: a green
          # bump is still a decision, not something to land unattended.
          # NOTE (2026-09-06): `issue` is documented for `on_update_fails`; that it is also
          # accepted for `on_update_succeeds` has NOT been verified here -- GitHub Actions
          # cannot be run from a local session. Confirm on the first manual dispatch before
          # trusting the schedule.
          on_update_succeeds: issue
          on_update_fails: issue
          # END CONFIGURATION BLOCK 2
